[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expertcache-benchmark"
version = "0.1.0"
description = "Deterministic offline expert-cache trace replay"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pydantic>=2.7,<3"]

[project.scripts]
expertcache = "expertcache.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
